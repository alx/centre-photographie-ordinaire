{{ define "main" }}
<section class="content">
  <h1>collection — le commun des mortels</h1>
  {{ .Content }}
  <div class="home-grid">
    {{ $photos := .Site.Data.photos }}
    {{ range $photos }}
    <a class="tile glightbox" href="{{ .src | relURL }}" data-gallery="collection" title="{{ .alt }}">
      <span class="photo-cadre">
        <img src="{{ .src | relURL }}" alt="{{ .alt }}" loading="lazy">
      </span>
    </a>
    {{ end }}
  </div>
  <p class="series-cta">
    <span class="titre-maj">les 400 thèmes</span> —
    <a href='{{ relURL "series/" }}'>parcourir la collection par série</a>
  </p>
</section>
{{ end }}
