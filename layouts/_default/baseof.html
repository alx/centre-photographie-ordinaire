<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ with .Site.Params.logo }}<meta property="og:image" content="{{ . | relURL }}">{{ end }}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | relURL }}">
  <script>
    // Redirige les liens Netlify Identity reçus par e-mail (invitation, reset
    // de mot de passe, confirmation) : le token voyage dans le hash de l'URL et
    // n'est traité QUE par le CMS (/admin/) ou le gestionnaire /.netlify/identity.
    // Sans ce script, le lien tombe sur la page d'accueil qui ignore le token.
    (function () {
      var h = location.hash || '';
      if (/#(invite_token|recovery_token|confirmation_token|signup_token|password_token)=/.test(h)) {
        location.replace(location.origin + '/admin/' + h);
      }
    })();
  </script>
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  {{ block "header" . }}{{ partial "header.html" . }}{{ end }}
  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ block "footer" . }}{{ partial "footer.html" . }}{{ end }}
  <script defer src="{{ resources.Get "js/app.js" | minify | fingerprint | relURL }}"></script>
</body>
</html>
