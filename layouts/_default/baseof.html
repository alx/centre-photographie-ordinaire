<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ with .Site.Params.logo }}<meta property="og:image" content="{{ . | relURL }}">{{ end }}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | relURL }}">
  <script>
    // Netlify Identity : les e-mails (invitation, reset, confirmation) pointent
    // sur le site avec le token dans le HASH (#invite_token=… etc.). Seul le
    // widget netlify-identity sait consommer ces tokens : à son chargement il
    // lit le hash, vérifie le token et ouvre d'office le formulaire adapté
    // (mot de passe pour une invitation, reset pour recovery…). La page
    // d'accueil du site ne le charge pas nativement → on l'injecte ici.
    (function () {
      var h = location.hash || '';
      if (/#(confirmation|invite|recovery|email_change)_token=/.test(h)) {
        var s = document.createElement('script');
        s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
        document.head.appendChild(s);
      }
    })();
  </script>
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
  {{ block "header" . }}{{ partial "header.html" . }}{{ end }}
  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ block "footer" . }}{{ partial "footer.html" . }}{{ end }}
  <script defer src="{{ resources.Get "js/app.js" | minify | fingerprint | relURL }}"></script>
</body>
</html>
