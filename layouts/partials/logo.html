{{- /* Logo officiel — carré jaune, cercle ardoise, texte circulaire */ -}}
<svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="76" height="76" role="img" aria-label="logo du centre de la photographie ordinaire">
  <rect width="200" height="200" fill="#FAB617"/>
  <circle cx="100" cy="100" r="50" fill="#14171A"/>
  <text x="100" y="97" text-anchor="middle" fill="#F5EFE4" font-family="Spectral, Georgia, serif" font-size="12">centre</text>
  <text x="100" y="112" text-anchor="middle" fill="#F5EFE4" font-family="Spectral, Georgia, serif" font-size="12">de la</text>
  <defs>
    <path id="arc-haut" d="M 100,100 m -80,0 a 80,80 0 1,1 160,0" fill="none"/>
    <path id="arc-bas" d="M 100,100 m -80,0 a 80,80 0 1,0 160,0" fill="none"/>
  </defs>
  <text fill="#14171A" font-family="Spectral, Georgia, serif" font-size="15" letter-spacing="2">
    <textPath href="#arc-haut" startOffset="50%" text-anchor="middle">photographie</textPath>
  </text>
  <text fill="#14171A" font-family="Spectral, Georgia, serif" font-size="15" letter-spacing="2">
    <textPath href="#arc-bas" startOffset="50%" text-anchor="middle">ordinaire</textPath>
  </text>
</svg>
