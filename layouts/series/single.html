{{ define "main" }}
<article class="content series-single">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ if .Params.images }}
  {{ $seed := printf "%.8s" (sha1 .File.ContentBaseName) }}
  <div class="scatter" data-seed="{{ $seed }}">
    {{ $n := 0 }}
    {{ range .Params.images }}
    {{ $n = add $n 1 }}
    <a class="scatter-tile glightbox" href="{{ . | relURL }}" data-gallery="serie-{{ $seed }}" title="{{ $.Title }} — {{ add $n 0 }}/{{ len $.Params.images }}">
      <img src="{{ . | relURL }}" alt="{{ $.Title }} — photographie {{ $n }}" loading="lazy">
    </a>
    {{ end }}
  </div>
  {{ end }}
</article>
{{ end }}
