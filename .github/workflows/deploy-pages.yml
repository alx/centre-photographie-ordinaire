# Déploiement GitHub Pages — Centre de la Photographie Ordinaire
# Construit Hugo (étendu) et publie public/ sur la branche gh-pages.
# baseURL relatif : le site est servi sous /centre-photographie-ordinaire/.
# (Netlify est en pause : le même build fonctionne là-bas sans baseURL.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Hugo étendu
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.151.0/hugo_extended_0.151.0_linux-amd64.tar.gz -O /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp
          /tmp/hugo version

      - name: Build
        run: /tmp/hugo --minify --baseURL /centre-photographie-ordinaire/

      - name: Publier sur gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
