# Sveltia CMS configuration (successeur de Netlify/Decap CMS)
# Docs: https://sveltiacms.app/en/docs/start
#
# Backend : github. En LOCAL, aucun auth n'est requis : le « local workflow »
# (File System Access API, navigateur Chromium) édite directement les fichiers
# du projet quand on clique « Work with Local Repository ». Le nom de repo sert
# alors uniquement à partitionner l'IndexedDB du navigateur (peut être fictif).
# Pour l'édition DISTANTE (bead ej9) : on ajoutera l'auth GitHub / Open Authoring.
backend:
  name: github
  repo: alx/centre-photographie-ordinaire

# Site public (affiché dans l'admin, pendant la phase de test)
site_url: https://alx.github.io/centre-photographie-ordinaire/
display_url: https://alx.github.io/centre-photographie-ordinaire/

# Dossier des images uploadées depuis l'admin
media_folder: "/static/uploads"
public_folder: "/uploads"

# Locale : français
locale: fr

collections:

  # ——— Actualité ——————————————————————————————————————————
  - name: actualite
    label: "Actualités"
    label_singular: "Actualité"
    description: "Expositions en cours, ateliers, vie du centre"
    folder: content/actualite
    create: true
    slug: "{{ fields.title | slugify }}"
    extensions: [".md"]
    fields:
      - name: title
        label: Titre
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        default: $(now)
      - name: image
        label: Image
        widget: image
        media_library:
          choose_image: true
        required: false
      - name: body
        label: Contenu
        widget: markdown

  # ——— Séries (400 thèmes) ————————————————————————————————
  # Une fiche par thème : content/series/serie-xxx/index.md
  - name: series
    label: "Séries (thèmes)"
    label_singular: "Série"
    description: "Les 400 thèmes de la collection — une fiche par thème, ~10 photos"
    folder: content/series
    create: true
    format: frontmatter
    # Chaque série est un bundle feuille : content/series/serie-xxx/index.md.
    # → collection IMBRICÉE (nested), pas un slash-slug (interdit en Sveltia).
    nested:
      subfolders: true
      depth: 2
    meta:
      path:
        index_file: index
    slug: "serie-{{ fields.title | slugify }}"
    fields:
      - name: title
        label: "Titre de la série"
      - name: images
        label: "Photos de la série (10 environ)"
        widget: list
        fields:
          - name: src
            label: "Chemin de l'image"
            widget: string
          - name: alt
            label: Légende
            widget: string
      - name: body
        label: "Texte de la série"
        widget: markdown

  # ——— Expositions passées ————————————————————————————————
  - name: expositions
    label: "Expositions passées"
    label_singular: "Exposition"
    folder: content/expositions-passees
    create: true
    slug: "{{ fields.title | slugify }}"
    extensions: [".md"]
    fields:
      - name: title
        label: "Titre de l'exposition"
      - name: date
        label: "Date (début)"
        widget: datetime
        format: YYYY-MM-DD
        default: $(now)
      - name: lieu
        label: Lieu
        widget: string
      - name: image
        label: Visuel
        widget: image
        media_library:
          choose_image: true
        required: false
      - name: body
        label: Texte
        widget: markdown
        required: false

  # ——— Pages institutionnelles ————————————————————————————
  - name: pages
    label: Pages
    label_singular: Page
    files:
      - name: accueil
        label: Accueil
        file: content/_index.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: body
            label: Contenu
            widget: markdown
      - name: histoire
        label: "La collection, son histoire"
        file: content/histoire.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: image
            label: Image
            widget: image
            media_library:
              choose_image: true
            required: false
          - name: body
            label: Contenu
            widget: markdown
      - name: centre
        label: "Le centre"
        file: content/le-centre.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: image
            label: Image
            widget: image
            media_library:
              choose_image: true
            required: false
          - name: body
            label: Contenu
            widget: markdown
      - name: soutenir
        label: "Soutenir le centre"
        file: content/soutenir.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: image
            label: Image
            widget: image
            media_library:
              choose_image: true
            required: false
          - name: body
            label: Contenu
            widget: markdown
      - name: collecte
        label: "La collecte"
        file: content/collecte.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: image
            label: Image
            widget: image
            media_library:
              choose_image: true
            required: false
          - name: body
            label: Contenu
            widget: markdown
      - name: recherche
        label: "Recherche et édition"
        file: content/recherche-et-edition.md
        fields:
          - name: title
            label: Titre
            widget: string
          - name: body
            label: Contenu
            widget: markdown
