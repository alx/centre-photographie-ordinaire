baseURL = "/"
locale = "fr-fr"
defaultContentLanguage = "fr"
title = "centre de la photographie ordinaire"
enableRobotsTXT = true
hasCJKLanguage = false

[params]
  description = "Le centre de la photographie ordinaire : 3 millions de photographies de famille, 400 thèmes. Collection, actualité, expositions, recherche et édition."
  # Les polices DINdong / DIN 1451 fette Breitschrift 1936 sont propriétaires :
  # elles sont utilisées si installées localement, sinon des substituts (voir main.css).
  # Spectral est chargée depuis Google Fonts (licence OFL).

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"

